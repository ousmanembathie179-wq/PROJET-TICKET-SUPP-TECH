<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support technique - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="container-fluid g-0">
        <div class="row g-0 vh-100">
            <div class="col-md-5 d-md-block">
                <img class="w-100 h-100" src="clint-bustrillos-K7OUs6y_cm8-unsplash.jpg" alt="image de la page de connexion">
            </div>
            <div class="col-md-6">
                <div class="logoa container text-center">
                    <img class="logo" src="depositphotos_41494073-stock-illustration-vector-wrench-icon.jpg" alt="logo">
                </div>
                <div class="connexion container">
                    <div class="mb-5">
                        <h2 class="Supp text-center">Support technique - Connexion</h2>
                    </div>
                    <div class="space">
                        <p class="text-center">Connectez-vous pour accéder à votre espace</p>
                    </div>
                    <form action="">
                        <div class="mb-3 mt-5">
                            <label for="email" class="form-label text-secondary">Email</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="mb-5 mt-5">
                            <label for="password" class="form-label text-secondary">Mot de passe</label>
                            <input type="password" class="form-control" id="password">
                        </div>
                        <div class="text-center mt-5">
                            <button type="submit" class="btn btn-primary w-50 mt-3">Connexion</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        </div>
    </section>
</body>

</html>
