<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container-fluid px-md-5 py-4 bg-light min-vh-100">

    <div class="mb-4">
        <a href="GestionUtilisateur.html" class="text-decoration-none fw-semibold text-primary">
            &larr; Retour au Tableau de bord des tickets
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white">
                
                <h3 class="text-center fw-bold text-dark mb-5">
                    Ajouter un nouvel utilisateur
                </h3>

                <form>
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary mb-2">Nom et prénom</label>
                        <input type="text" class="form-control custom-input py-3 px-4 rounded-3" 
                               placeholder="Ousmane Mbathie">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary mb-2">Adresse Email</label>
                        <input type="email" class="form-control custom-input py-3 px-4 rounded-3" 
                               placeholder="ousmanembathie@gmail.com">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary mb-2">Mot de passe</label>
                        <input type="password" class="form-control custom-input py-3 px-4 rounded-3" 
                               placeholder="••••••••••••••">
                    </div>

                    <div class="mb-5">
                        <label class="form-label fw-bold text-secondary mb-2">Rôle</label>
                        <select class="form-select custom-input py-3 px-4 rounded-3 fw-medium">
                            <option value="technicien" selected>Technicien</option>
                            <option value="employe">Employé</option>
                        </select>
                    </div>

                    <div class="d-flex align-items-center justify-content-end gap-5">
                        <a href="GestionUtilisateur.html" class="text-decoration-none text-secondary fw-semibold fs-5">
                            Annuler
                        </a>
                        <button type="submit" class="btn btn-primary px-5 py-3 rounded-3 fw-bold shadow-sm">
                            Enregistrer l'utilisateur
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

</main>

    
</body>
</html>
