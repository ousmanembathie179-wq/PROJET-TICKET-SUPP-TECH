<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Ticket</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            
            <a href="dashboard.html" class="text-decoration-none mb-3 d-inline-block">
                &larr; Retour au Tableau de bord
            </a>
            <div class="card border-0 shadow-sm p-4 p-md-5">
                <h2 class="text-center mb-4 fw-bold">Ouvrir un nouveau ticket</h2>
                
                <form action="/creer-ticket" method="POST">
                    <div class="mb-4">
                        <label for="titre" class="form-label fw-semibold">Titre du problème</label>
                        <input type="text" class="form-control form-control-lg bg-light border-0" 
                               id="titre" name="titre" placeholder="Entrez le titre de votre problème ici..." required>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">Description détaillée</label>
                        <textarea class="form-control bg-light border-0" id="description" name="description" 
                                  rows="6" placeholder="Décrivez votre problème ici..." required></textarea>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg px-5">Créer le ticket</button>
                        <a href="dashboard.html" class="btn btn-outline-secondary btn-lg px-4">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
    
</body>
</html>
